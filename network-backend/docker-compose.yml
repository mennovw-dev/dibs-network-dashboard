services:
  dibs-network-backend:
    image: dibs-network-backend:latest
    build: .
    ports:
      - "127.0.0.1:8010:8010"
    volumes:
      # Mount whole tmp so SQLite WAL/SHM stay consistent with gorm.db after seeds.
      - /home/hospi/dibs-staging/tmp:/app/staging-tmp:ro
    environment:
      - PORT=8010
      - LISTEN_ALL=true
      - DATABASE_PATH=/app/staging-tmp/gorm.db
      - GIN_MODE=release
      - CORS_ORIGINS=https://network.dibs-app.nl,http://localhost:5173,http://127.0.0.1:5173,http://127.0.0.1:8012
    restart: unless-stopped
